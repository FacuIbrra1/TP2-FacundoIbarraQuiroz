<header class="encabezado">
  <div class="encabezado-contenido">
    <a class="marca" routerLink="/publicaciones">
      <img src="apple-touch-icon.png" alt="" width="40" height="40" />
      <span>Potrero <strong>Libre</strong></span>
    </a>

    <!-- Sprint 3: el menú solo aparece con sesión (las pantallas están protegidas con el sesionGuard). -->
    @if (autenticacion.usuario()) {
      <nav class="menu" aria-label="Principal">
        <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
        <a routerLink="/mi-perfil" routerLinkActive="activo">Mi perfil</a>
      </nav>
    }

    <div class="cuenta">
      @if (autenticacion.usuario()) {
        <span class="usuario">
          <img [src]="autenticacion.usuario()?.imagenUrl" alt="" width="32" height="32" />
          &#64;{{ autenticacion.usuario()?.username }}
        </span>
        <button class="boton boton-secundario boton-chico" type="button" (click)="salir()">
          Salir
        </button>
      } @else {
        <a routerLink="/login" routerLinkActive="activo">Ingresar</a>
        <a class="boton boton-chico" routerLink="/registro">Crear cuenta</a>
      }
    </div>
  </div>
</header>

<main class="contenido">
  <router-outlet />
</main>

<!-- A los 10 minutos de iniciar sesión (el token vence a los 15). -->
@if (autenticacion.mostrarAviso()) {
  <app-modal-confirmacion
    titulo="Tu sesión está por vencer"
    mensaje="Quedan 5 minutos de sesión. ¿Querés extenderla otros 15 minutos?"
    textoConfirmar="Extender sesión"
    textoCancelar="Ahora no"
    [procesando]="extendiendo()"
    [error]="errorAlExtender()"
    (confirmar)="extenderSesion()"
    (cancelar)="cerrarAviso()"
  />
}
